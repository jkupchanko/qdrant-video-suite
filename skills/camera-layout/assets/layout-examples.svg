<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1590" viewBox="0 0 1360 1590" role="img" aria-labelledby="title desc">
<title id="title">Camera layout examples with presenter placeholders</title>
<desc id="desc">Six sixteen by nine examples: presenter full screen, content only, small top right rectangle, seventy thirty side panel, equal presenter split, and two content views. No actual faces.</desc>
<rect x="0" y="0" width="1360" height="1590" rx="0" fill="#151a24"/>
<text x="55" y="55" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="34" text-anchor="start">Choose the layout from the passage</text>
<text x="55" y="90" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="23" text-anchor="start">Rectangles stand in for the presenter. These are proposed layouts, not captured results.</text>
<text x="55" y="158" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="start">Presenter full screen</text>
<g transform="translate(55,178)">
<rect x="0" y="0" width="600" height="337.5" rx="6" fill="#0b0f19" stroke="#596475" stroke-width="2"/><rect x="0" y="0" width="600" height="337.5" rx="5" fill="#394454" stroke="#dc244c" stroke-width="2"/><text x="300.0" y="168.75" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Presenter</text><text x="300.0" y="193.75" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">placeholder</text>
</g>
<text x="55" y="550" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Use for an opening, explanation or close.</text>
<text x="55" y="580" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">The person is the main thing to see.</text>
<text x="705" y="158" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="start">Content full screen</text>
<g transform="translate(705,178)">
<rect x="0" y="0" width="600" height="337.5" rx="6" fill="#0b0f19" stroke="#596475" stroke-width="2"/><rect x="0" y="0" width="600" height="337.5" rx="0" fill="#0b0f19"/><text x="20" y="37" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Code or search results</text><rect x="18" y="70" width="564" height="36" rx="3" fill="#202938"/><text x="28" y="95" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Question</text><rect x="18" y="125" width="564" height="36" rx="3" fill="#202938"/><text x="28" y="150" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Passage</text><rect x="18" y="180" width="564" height="36" rx="3" fill="#202938"/><text x="28" y="205" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Check the result</text>
</g>
<text x="705" y="550" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Use while inspecting code or results.</text>
<text x="705" y="580" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">The presenter is hidden.</text>
<text x="55" y="638" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="start">Small rectangular inset</text>
<g transform="translate(55,658)">
<rect x="0" y="0" width="600" height="337.5" rx="6" fill="#0b0f19" stroke="#596475" stroke-width="2"/><rect x="0" y="0" width="438.0" height="337.5" rx="0" fill="#0b0f19"/><text x="20" y="37" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Search demonstration</text><rect x="18" y="70" width="402.0" height="36" rx="3" fill="#202938"/><text x="28" y="95" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Question</text><rect x="18" y="125" width="402.0" height="36" rx="3" fill="#202938"/><text x="28" y="150" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Passage</text><rect x="18" y="180" width="402.0" height="36" rx="3" fill="#202938"/><text x="28" y="205" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Check the result</text><rect x="462.0" y="16.875" width="120.0" height="90.00000000000001" rx="5" fill="#394454" stroke="#dc244c" stroke-width="2"/><text x="522.0" y="61.87500000000001" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Presenter</text><text x="522.0" y="86.875" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">placeholder</text>
</g>
<text x="55" y="1030" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Use on an uncrowded demonstration.</text>
<text x="55" y="1060" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Presenter width is 20% of the frame.</text>
<text x="705" y="638" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="start">Presenter side panel</text>
<g transform="translate(705,658)">
<rect x="0" y="0" width="600" height="337.5" rx="6" fill="#0b0f19" stroke="#596475" stroke-width="2"/><rect x="0" y="0" width="420.0" height="337.5" rx="0" fill="#0b0f19"/><text x="20" y="37" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Simple walkthrough</text><rect x="18" y="70" width="384.0" height="36" rx="3" fill="#202938"/><text x="28" y="95" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Question</text><rect x="18" y="125" width="384.0" height="36" rx="3" fill="#202938"/><text x="28" y="150" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Passage</text><rect x="18" y="180" width="384.0" height="36" rx="3" fill="#202938"/><text x="28" y="205" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Check the result</text><rect x="432.0" y="27.0" width="150.0" height="283.5" rx="5" fill="#394454" stroke="#dc244c" stroke-width="2"/><text x="507.0" y="168.75" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Presenter</text><text x="507.0" y="193.75" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">placeholder</text>
</g>
<text x="705" y="1030" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Give the content about 70% of the width.</text>
<text x="705" y="1060" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Use for a simple view that stays readable.</text>
<text x="55" y="1118" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="start">Equal presenter and content split</text>
<g transform="translate(55,1138)">
<rect x="0" y="0" width="600" height="337.5" rx="6" fill="#0b0f19" stroke="#596475" stroke-width="2"/><rect x="0" y="0" width="300.0" height="337.5" rx="5" fill="#394454" stroke="#dc244c" stroke-width="2"/><text x="150.0" y="168.75" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Presenter</text><text x="150.0" y="193.75" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">placeholder</text><rect x="300.0" y="0" width="300.0" height="337.5" rx="0" fill="#0b0f19"/><text x="450" y="75" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Simple concept</text><text x="450" y="145" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="middle">perro</text><text x="450" y="195" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="middle">dog</text><text x="450" y="265" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">Shared concept</text>
</g>
<text x="55" y="1510" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Use when both sides need equal space.</text>
<text x="55" y="1540" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Keep the visual simple enough to read.</text>
<text x="705" y="1118" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="27" text-anchor="start">Two content views</text>
<g transform="translate(705,1138)">
<rect x="0" y="0" width="600" height="337.5" rx="6" fill="#0b0f19" stroke="#596475" stroke-width="2"/><rect x="0" y="0" width="291.0" height="337.5" rx="0" fill="#0b0f19"/><text x="20" y="37" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Option A</text><rect x="18" y="70" width="255.0" height="36" rx="3" fill="#202938"/><text x="28" y="95" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Question</text><rect x="18" y="125" width="255.0" height="36" rx="3" fill="#202938"/><text x="28" y="150" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Passage</text><rect x="18" y="180" width="255.0" height="36" rx="3" fill="#202938"/><text x="28" y="205" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Check the result</text><rect x="309.0" y="0" width="291.0" height="337.5" rx="0" fill="#0b0f19"/><text x="329.0" y="37" fill="#f0f3fa" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Option B</text><rect x="327.0" y="70" width="255.0" height="36" rx="3" fill="#202938"/><text x="337.0" y="95" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Question</text><rect x="327.0" y="125" width="255.0" height="36" rx="3" fill="#202938"/><text x="337.0" y="150" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Passage</text><rect x="327.0" y="180" width="255.0" height="36" rx="3" fill="#202938"/><text x="337.0" y="205" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Check the result</text>
</g>
<text x="705" y="1510" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Use to compare two alternatives.</text>
<text x="705" y="1540" fill="#b7c1cf" font-family="Arial, sans-serif" font-size="22" text-anchor="start">Two halves do not require a presenter.</text>
</svg>
